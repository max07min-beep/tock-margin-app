<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>信用需給分析ダッシュボード</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="mb-8 flex flex-col md:flex-row md:items-center md:justify-between bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">📈 信用需給分析ダッシュボード</h1>
                <p class="text-sm text-slate-500 mt-1">Yahoo!ファイナンス等のペーストデータを確実パース・自動解析</p>
            </div>
            <div class="mt-4 md:mt-0 text-right">
                <span id="update-date" class="inline-block bg-slate-100 text-slate-600 text-xs px-3 py-1 rounded-full font-medium">データ未読込</span>
            </div>
        </header>

        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 mb-8">
            <h2 class="text-lg font-bold text-slate-800 mb-2">📋 信用残データペースト解析</h2>
            <p class="text-xs text-slate-500 mb-4">対象銘柄を入力し、ペーストエリアにそのまま貼り付けて「解析する」を押してください。</p>
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">銘柄コード</label>
                    <input type="text" id="target-code" value="7203" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="md:col-span-3">
                    <label class="block text-xs font-bold text-slate-600 mb-1">銘柄名</label>
                    <input type="text" id="target-name" value="トヨタ自動車" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <div class="mb-4">
                <label class="block text-xs font-bold text-slate-600 mb-1">表データの貼り付け</label>
                <textarea id="paste-area" rows="6" placeholder="ここに表データをペーストしてください" class="w-full border border-slate-300 rounded-lg p-3 text-xs font-mono focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
            </div>

            <button onclick="parseAndAnalyze()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm px-6 py-2.5 rounded-xl shadow-sm transition">
                データを解析して反映する
            </button>
        </section>

        <section class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="p-6 border-b border-slate-100">
                <h2 class="text-lg font-bold text-slate-800">📊 監視銘柄 分析サマリー</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b border-slate-100">
                            <th class="p-4">コード</th>
                            <th class="p-4">銘柄名</th>
                            <th class="p-4">最新信用倍率</th>
                            <th class="p-4">買残トレンド（シコリ掃除状況）</th>
                            <th class="p-4">スコア</th>
                            <th class="p-4">判定シグナル</th>
                        </tr>
                    </thead>
                    <tbody id="stock-table-body" class="divide-y divide-slate-100 text-sm">
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        let analyzedStocks = JSON.parse(localStorage.getItem('analyzedStocks')) || [];

        function renderTable() {
            const tbody = document.getElementById('stock-table-body');
            tbody.innerHTML = '';
            
            if (analyzedStocks.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="p-6 text-center text-slate-400 text-xs">データがありません。上のフォームからペーストして解析してください。</td></tr>';
                return;
            }

            analyzedStocks.forEach(stock => {
                const row = document.createElement('tr');
                row.className = "hover:bg-slate-50/50 transition";
                
                let signalBadge = stock.signal === "ロング推奨" 
                    ? '<span class="bg-emerald-100 text-emerald-700 text-xs px-2.5 py-1 rounded-full font-bold">ロング推奨</span>'
                    : '<span class="bg-amber-100 text-amber-700 text-xs px-2.5 py-1 rounded-full font-bold">下落警戒・様子見</span>';

                row.innerHTML = `
                    <td class="p-4 font-mono font-bold text-slate-700">${stock.code}</td>
                    <td class="p-4 font-bold text-slate-900">${stock.name}</td>
                    <td class="p-4 font-mono font-bold text-blue-600">${stock.marginRatio} 倍</td>
                    <td class="p-4 text-xs text-slate-600">${stock.trend}</td>
                    <td class="p-4 font-bold font-mono">${stock.score} 点</td>
                    <td class="p-4">${signalBadge}</td>
                `;
                tbody.appendChild(row);
            });

            document.getElementById('update-date').innerText = "最終更新: " + new Date().toLocaleDateString();
        }

        function parseAndAnalyze() {
            const code = document.getElementById('target-code').value.trim();
            const name = document.getElementById('target-name').value.trim();
            const rawText = document.getElementById('paste-area').value.trim();

            if (!rawText) {
                alert("データを貼り付けてください。");
                return;
            }

            // テキスト全体からすべての「日付（YYYY/M/D または YYYY/MM/DD）」を順番に抽出
            const dateRegex = /\d{4}\/\d{1,2}\/\d{1,2}/g;
            const dates = rawText.match(dateRegex);

            if (!dates || dates.length === 0) {
                alert("有効な日付が見つかりませんでした。データ形式を確認してください。");
                return;
            }

            // 日付文字列をすべてスペースに置換して、残った数値を純粋に抽出
            let textWithoutDates = rawText;
            dates.forEach(d => {
                textWithoutDates = textWithoutDates.replace(d, ' ');
            });

            // カンマ区切りの数値やマイナス数値、小数点をすべて配列として取得
            const allTokens = textWithoutDates.match(/[-+]?[\d,]+\.?\d*/g);
            
            if (!allTokens) {
                alert("数値データの抽出に失敗しました。");
                return;
            }

            const cleanNumbers = allTokens
                .map(t => t.replace(/,/g, ''))
                .filter(t => t !== '' && !isNaN(t))
                .map(Number);

            // 1レコードあたり5つの数値（売残, 買残, 売残増減, 買残増減, 信用倍率）があると仮定して組み立て
            let records = [];
            let numIdx = 0;

            for (let i = 0; i < dates.length; i++) {
                if (numIdx + 4 < cleanNumbers.length) {
                    records.push({
                        date: dates[i],
                        sellMargin: cleanNumbers[numIdx],
                        buyMargin: cleanNumbers[numIdx + 1],
                        sellChange: cleanNumbers[numIdx + 2],
                        buyChange: cleanNumbers[numIdx + 3],
                        ratio: cleanNumbers[numIdx + 4]
                    });
                    numIdx += 5;
                }
            }

            if (records.length === 0) {
                alert("データを表として正しく構築できませんでした。");
                return;
            }
