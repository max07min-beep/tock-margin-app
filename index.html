<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>動作テスト用</title>
</head>
<body style="padding: 40px; font-family: sans-serif;">
    <h1>🧪 ボタン動作テスト</h1>
    <p>下のボタンを押して、アラートが出るか確認してください。</p>
    
    <button id="test-btn" style="padding: 15px 30px; font-size: 18px; background: blue; color: white; cursor: pointer;">
        ここを押してください
    </button>

    <script>
        // ボタンに直接イベントをリスナーとして登録する（HTML側でのonclick依存を排除）
        document.getElementById('test-btn').addEventListener('click', function() {
            alert('🎉 ボタンは正常に機能しています！');
        });
    </script>
</body>
</html>
